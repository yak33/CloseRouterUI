name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只保留一次部署。cancel-in-progress 设为 false：
# 正在进行的部署不该被新推送打断，否则可能留下半完成的站点。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pages 项目站点挂在 /<仓库名>/ 下。这里从 GITHUB_REPOSITORY（owner/repo）
      # 截出仓库名，而不是用 github.event.repository.name —— 后者在
      # workflow_dispatch 手动触发时为空，会构建出 BASE_PATH=// 导致资源全 404。
      - name: Resolve base path
        run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - run: pnpm build

      # history 模式下直接访问 /logs 这类子路由，Pages 会返回 404。
      # 把 SPA 外壳复制成 404.html，交还给前端路由接管。
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
