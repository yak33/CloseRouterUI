<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>closerouter — 模型路由控制台</title>
    <script>
      // 在首帧渲染前定好主题，否则暗色用户会先看到一闪的白屏。
      // 取值需与 useTheme 的 ThemePreference 保持一致：light | dark | system
      ;(() => {
        try {
          const saved = localStorage.getItem('closerouter-theme')
          const explicit = saved === 'light' || saved === 'dark' ? saved : null
          const dark = explicit
            ? explicit === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch {
          /* 隐私模式下 localStorage 不可用，回落到默认亮色即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
